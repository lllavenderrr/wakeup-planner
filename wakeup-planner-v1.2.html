<style>

adding:12px 17px;border-radius:13px;white-space:nowrap}.nav-btn:hover{background:#edebe8}.nav-btn.active{background:var(--ink);color:white}.nav-btn svg{width:18px;height:18px}.page-intro{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:22px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--violet);text-transform:uppercase;margin-bottom:8px}.lead{color:var(--muted);font-size:14px;margin-top:8px}.cards{display:grid;gap:20px}.layout{grid-template-columns:minmax(0,1.05fr) minmax(330px,.95fr);align-items:start}.panel{background:var(--card);border:1px solid #ecebe8;border-radius:24px;padding:24px;box-shadow:var(--shadow)}.panel-title{font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:18px}.panel-title svg{width:19px;height:19px;color:var(--violet)}.panel-sub{color:var(--muted);font-size:13px;line-height:1.65;margin-top:-8px;margin-bottom:18px}.panel + .panel{margin-top:18px}.hero{background:linear-gradient(118deg,#21263f 0%,#343457 75%,#49436d 100%);color:white;border-radius:28px;padding:30px 31px 27px;box-shadow:0 20px 35px rgba(37,43,67,.13);position:relative;overflow:hidden;margin-bottom:21px}.hero::before{content:'';position:absolute;width:290px;height:290px;border:1px solid rgba(255,255,255,.14);border-radius:50%;right:-130px;top:-110px}.hero::after{content:'';position:absolute;width:165px;height:165px;border:1px solid rgba(255,255,255,.09);border-radius:50%;right:-40px;top:25px}.hero>*{position:relative;z-index:1}.hero-overline{color:#d7d0ed;font-size:12px;font-weight:650;display:flex;align-items:center;gap:7px;letter-spacing:.5px}.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.hero-badge{color:#ffdfa9;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:6px 9px;border-radius:99px;font-size:11px;font-weight:700}.hero-time{font-size:clamp(70px,10vw,92px);font-weight:780;letter-spacing:-5px;line-height:1.15;margin-top <script>

if (typeof window.structuredClone !== 'function') { window.structuredClone = (x) => JSON.parse(JSON.stringify(x)); }
/* WakeUp Planner — pure, dependency-free scheduling logic. */
const SCHEMA_VERSION = 1;
const MINUTE = 60_000;

function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
}

function act(id, name, choices) {
  return { id, name, options: choices.map(([suffix, label, minutes]) => ({ id: `${id}_${suffix}`, name: label, minutes })) };
}

function defaultState(now = new Date()) {
  const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const tomorrowStr = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, '0')}-${String(tomorrow.getDate()).padStart(2, '0')}`;
  const activities = [
    act('wash', '刷牙洗臉', [['normal', '一般', 10], ['fast', '快速', 5]]),
    act('makeup', '化妝', [['none', '不化妝', 0], ['quick', '快速', 10], ['daily', '日常', 25], ['full', '完整妝容', 45]]),
    act('hair', '整理頭髮', [['none', '不整理', 0], ['quick', '簡單整理', 5], ['normal', '日常造型', 15], ['full', '完整造型', 30]]),
    act('clothes', '換衣服／整理包包', [['quick', '快速', 5], ['normal', '一般', 10]]),
    act('breakfast', '吃早餐', [['none', '不吃', 0], ['drink', '喝飲料', 5], ['toast', '簡單早餐', 15], ['takeaway', '外帶早餐', 20], ['cooked', '現做早餐', 30]])
  ];
  const selections = {
    wash: { enabled: true, optionId: 'wash_normal' },
    makeup: { enabled: true, optionId: 'makeup_daily' },
    hair: { enabled: true, optionId: 'hair_normal' },
    clothes: { enabled: true, optionId: 'clothes_normal' },
    breakfast: { enabled: true, optionId: 'breakfast_toast' }
  };
  const quick = structuredClone(selections);
  quick.makeup.optionId = 'makeup_quick';
  quick.hair.optionId = 'hair_quick';
  quick.breakfast.optionId = 'breakfast_none';
  const special = structuredClone(selections);
  special.makeup.optionId = 'makeup_full';
  special.hair.optionId = 'hair_full';
  return {
    schemaVersion: SCHEMA_VERSION,
    activities,
    routes: [],
    metroStops: [],
    presets: [
      { id: 'preset_daily', name: '日常準備（範例）', selections: structuredClone(selections), bufferMinutes: 10, mode: 'arrive', leadMinutes: 5, routeId: '', travelMinutes: 20 },
      { id: 'preset_quick', name: '快速出門（範例）', selections: quick, bufferMinutes: 5, mode: 'depart', leadMinutes: 5, routeId: '', travelMinutes: 20 },
      { id: 'preset_special', name: '重要場合（範例）', selections: special, bufferMinutes: 15, mode: 'arrive', leadMinutes: 5, routeId: '', travelMinutes: 20 }
    ],
    plan: { targetDate: tomorrowStr, targetTime: '09:00', mode: 'arrive', selectedRouteId: '', travelMinutes: 20, leadMinutes: 5, bufferMinutes: 10, metroStopId: '', metroRideMinutes: 20, metroWalkMinutes: 7, metroPlatformLead: 3, metroService: 'auto', selections, presetId: 'preset_daily' },
    settings: { shortcutName: 'WakeUp 設定鬧鐘' },
    updatedAt: new Date().toISOString()
  };
}

function num(value, min, max, fallback = min) {
  if (value === '' || value === null || value === undefined) return fallback;
  const n = Number(value);
  return Number.isFinite(n) ? Math.min(max, Math.max(min, Math.round(n))) : fallback;
}

function parseLocalDateTime(day, time) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(day ?? '');
  const t = /^([01]\d|2[0-3]):([0-5]\d)$/.exec(time ?? '');
  if (!m || !t) return null;
  const [y, mo, d, h, mi] = [Number(m[1]), Number(m[2]), Number(m[3]), Number(t[1]), Number(t[2])];
  const result = new Date(y, mo - 1, d, h, mi);
  if (result.getFullYear() !== y || result.getMonth() !== mo - 1 || result.getDate() !== d || result.getHours() !== h || result.getMinutes() !== mi) return null;
  return result;
}

function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(date) { return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`; }
function timeKey(date) { return `${pad(date.getHours())}:${pad(date.getMinutes())}`; }
function fullStamp(date) {
  return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())}（${'日一二三四五六'[date.getDay()]}）${date.getHours() < 12 ? '上午' : '下午'} ${pad(date.getHours() % 12 || 12)}:${pad(date.getMinutes())}`;
}

function effectiveTravel(state) {
  const route = state.routes.find(r => r.id === state.plan.selectedRouteId);
  return route ? num(route.minutes, 0, 600, 20) : num(state.plan.travelMinutes, 0, 600, 20);
}

function serviceForDate(day, pref) {

function recentTrain(target, lastDepartureTime, pref) {
  // 組出目標日及前幾天所有班次，解決跨日和 00:08 末班的問題。
  let best=null;
  for(let offset=-3;offset<=0;offset++) {
    const serviceDate=new Date(target.getFullYear(),target.getMonth(),target.getDate()+offset);
    const service=serviceForDate(serviceDate,pref);
    for(const hm of METRO_DEPARTURES[service]) {
      const [h,m]=hm.split(':').map(Number);
      const departure=new Date(serviceDate.getFullYear(),serviceDate.getMonth(),serviceDate.getDate()+(h===0?1:0),h,m);
      if(departure.getTime()<=lastDepartureTime.getTime() && (!best || departure>best.date)) best={date:departure,serviceDate,service};

function calculate(state) {
  const p = state.plan;
  const target = parseLocalDateTime(p.targetDate, p.targetTime);
  if (!target) return { error: '日期或時間不正確，請重新選擇。' };
  const mode = ['depart', 'arrive', 'board', 'metro'].includes(p.mode) ? p.mode : 'arrive';
  const bufferMinutes = num(p.bufferMinutes, 0, 180, 0);
  const leadMinutes = mode === 'board' ? num(p.leadMinutes, 0, 120, 0) : 0;
  const travelMinutes = mode === 'depart' ? 0 : effectiveTravel(state);
  const tasks = [];
  for (const activity of state.activities) {
    const selection = p.selections?.[activity.id];
    if (!selection?.enabled) continue;
    const option = activity.options.find(o => o.id === selection.optionId) ?? activity.options[0];
    if (!option) continue;
    tasks.push({ id: activity.id, name: activity.name, option: option.name, minutes: num(option.minutes, 0, 240) });
  }
  const prepMinutes = tasks.reduce((sum, task) => sum + task.minutes, 0);
  if (mode === 'metro') {
    const rideMinutes=metroRideTime(state);
    const walkMinutes=num(p.metroWalkMinutes,0,240,7);
    const platformLead=num(p.metroPlatformLead,0,120,3);
    const cutoff=new Date(target.getTime()-rideMinutes*MINUTE);
    const train=recentTrain(target,cutoff,p.metroService);
    if(!train) return {error:'在這個時間之前找不到新莊站往南勢角方向的可搭班次。請檢查日期、時間或車程。'};
    const arrive=new Date(train.date.getTime()+rideMinutes*MINUTE);
    const slackMinutes=Math.round((target-arrive)/MINUTE);
    if(slackMinutes>120)return {error:'這個時段附近沒有適合的班次，最近一班會提早超過 2 小時抵達。請調整目標時間或另選交通方式。'};
    const leave=new Date(train.date.getTime()-(walkMinutes+platformLead)*MINUTE);
    const wake=new Date(leave.getTime()-(prepMinutes+bufferMinutes)*MINUTE);
    const timeline=[{name:'起床',start:wake,end:null,kind:'start'}];
    let cursor=wake.getTime();
    for(const task of tasks){const start=new Date(cursor);cursor+=task.minutes*MINUTE;timeline.push({name:task.name,description:task.option,start,end:new Date(cursor),minutes:task.minutes,kind:'task'});}
    if(bufferMinutes){const start=new Date(cursor);cursor+=bufferMinutes*MINUTE;timeline.push({name:'彈性緩衝',start,end:new Date(cursor),minutes:bufferMinutes,kind:'buffer'});}
    timeline.push({name:'從家裡出門',start:leave,end:null,kind:'milestone'});
    timeline.push({name:'抵達新莊站',start:new Date(leave.getTime()+walkMinutes*MINUTE),end:null,kind:'milestone'});
    if(platformLead)timeline.push({name:'進站／候車緩衝',start:new Date(leave.getTime()+walkMinutes*MINUTE),end:train.date,minutes:platformLead,kind:'buffer'});
    timeline.push({name:'新莊站往南勢角方向：列車離站',start:train.date,end:null,kind:'target'});
    timeline.push({name:'預計抵達目的站',start:arrive,end:null,kind:'milestone'});
    if(slackMinutes)timeline.push({name:'目標抵達時間（可提前 '+slackMinutes+' 分）',start:target,end:null,kind:'target'});
    const totalMinutes=Math.round((target-wake)/MINUTE);
    return {target,wake,leave,reach:arrive,timeline,tasks,mode,prepMinutes,bufferMinutes,leadMinutes:platformLead,travelMinutes:walkMinutes+rideMinutes,totalMinutes,rideMinutes,walkMinutes,platformLead,cutoff,trainDate:train.date,trainService:train.service,serviceDate:train.serviceDate,slackMinutes,arrival:arrive};
  }
  const totalMinutes = prepMinutes + bufferMinutes + leadMinutes + travelMinutes;
  const wake = new Date(target.getTime() - totalMinutes * MINUTE);
  const leave = new Date(target.getTime() - (leadMinutes + travelMinutes) * MINUTE);
  const reach = new Date(target.getTime() - leadMinutes * MINUTE);
  let cursor = wake.getTime();
  const timeline = [{ name: '起床', start: new Date(cursor), end: null, minutes: 0, kind: 'start' }];
  for (const task of tasks) {
    const start = new Date(cursor);
    cursor += task.minutes * MINUTE;
    timeline.push({ name: task.name, description: task.option, start, end: new Date(cursor), minutes: task.minutes, kind: 'task' });
  }
  if (bufferMinutes > 0) {
    const start = new Date(cursor);
    cursor += bufferMinutes * MINUTE;
    timeline.push({ name: '彈性緩衝', start, end: new Date(cursor), minutes: bufferMinutes, kind: 'buffer' });
  }
  timeline.push({ name: mode === 'depart' ? '出門（目標）' : '離開家', start: leave, end: null, minutes: 0, kind: 'milestone' });
  if (mode !== 'depart') {
    timeline.push({ name: mode === 'board' ? '抵達搭乘地點' : '抵達目的地', start: reach, end: null, minutes: travelMinutes, kind: 'milestone' });
  }
  if (mode === 'board') timeline.push({ name: '班次／搭乘時間', start: target, end: null, minutes: leadMinutes, kind: 'target' });
  return { target, wake, leave, reach, timeline, tasks, mode, prepMinutes, bufferMinutes, leadMinutes, travelMinutes, totalMinutes };
}

  Object.assign(plan,{metroStopId:metroStops.some(x=>x.id===srcPlan.metroStopId)?srcPlan.metroStopId:'',metroRideMinutes:num(srcPlan.metroRideMinutes,0,600,20),metroWalkMinutes:num(srcPlan.metroWalkMinutes,0,240,7),metroPlatformLead:num(srcPlan.metroPlatformLead,0,120,3),metroService:['auto','weekday','holiday'].includes(srcPlan.metroService)?srcPlan.metroService:'auto'});

}

function updateStaleDate(state, now = new Date()) {

  const setup=panel('iPhone 捷徑鬧鐘','alarm',`<div class="field"><label class="field-label">捷徑名稱（必須與 iPhone 內相同）</label><input class="text-field" type="text" maxlength="80" data-field="shortcutName" value="${esc(state.settings.shortcutName)}"></div><ol class="steps"><li><div>在 iPhone 打開 <strong>「捷徑」App →「＋」</strong> 建立新的捷徑，名稱設為 <span class="code-pill">${esc(state.settings.shortcutName)}</span>。</div></li><li><div>新增動作 <strong>「從輸入取得日期」（Get Dates from Input）</strong>，輸入指定為 <strong>「捷徑輸入」（Shortcut Input）</strong>。本 App 會傳送 <span class="code-pill">YYYY-MM-DD HH:mm</span>。</div></li><li><div>新增動作 <strong>「取得列表項目」（Get Item from List）</strong>，取第一個日期，以免日期清單有多個值。</div></li><li><div>新增 <strong>「製作鬧鐘」（Create Alarm）</strong> 動作，時間欄位放入上一步取得的日期，標籤可填「WakeUp Planner」。</div></li><li><div>先在「捷徑」App 內測試：確認「時鐘」新增正確時間，再回本 App 按 <strong>「iPhone 鬧鐘」</strong>。</div></li></ol><div class="secondary-note">注意：一般 iPhone「時鐘」鬧鐘依<strong>時刻</strong>響鈴，並不鎖定所傳送的特定年月日。本 App 限制在預計起床前 24 小時內呼叫捷徑。請確認鬧鐘已建立、已啟用、沒有重複舊鬧鐘。不同 iOS 版本的捷徑動作名稱及欄位可能略有不同。</div><div class="button-row" style="margin-top:16px"><button class="btn outline small" data-action="copy-alarm-input" type="button">${icon('copy',15)}複製測試用時間</button><a class="btn light small" href="https://support.apple.com/guide/shortcuts/run-a-shortcut-using-a-url-scheme-apd624386f42/ios" target="_blank" rel="noopener">Apple 捷徑說明 ${icon('arrow',15)}</a></div>`, '僅在你點擊按鈕時嘗試啟動捷徑，不會在背景偷偷設定鬧鐘。');
  const backup=panel('資料備份與復原','save',`<p class="hint">活動、路線、情境與目前計畫保存在此裝置的本機瀏覽器儲存空間。建議定期匯出 JSON 備份，存到 iCloud Drive。</p><div class="button-row" style="margin:18px 0"><button class="btn" data-action="export" type="button">${icon('download')}匯出 JSON 備份</button><button class="btn outline" data-action="import" type="button">${icon('upload')}匯入備份</button></div><div class="secondary-note">匯入會<strong>取代</strong>現在的設定；更換裝置、刪除網頁 App 或清除 Safari 網站資料，都可能造成本機資料遺失。</div><div class="section-divider"></div><div class="stats-row"><span>目前儲存方式</span><strong>${storageMode()==='localstorage'?'localStorage（本機）':'無法儲存'}</strong></div><div class="stats-row"><span>活動／情境／路線</span><strong>${state.activities.length}／${state.presets.length}／${state.routes.length}</strong></div><div class="stats-row"><span>最近修改</span><strong>${esc(state.updatedAt?.slice(0,10)||'—')}</strong></div><div class="button-row" style="margin-top:16px"><button type="button" class="btn danger small" data-action="reset">${icon('trash',16)}重設所有資料</button></div>`);
  const install=panel('將 App 加到 iPhone 主畫面','smartphone',`<ol class="steps"><li><div>把此網站部署成 <strong>HTTPS 網址</strong>，在 iPhone <strong>Safari</strong> 打開該連結。</div></li><li><div>點選 Safari <strong>分享</strong>，選擇 <strong>「加入主畫面」</strong>。</div></li><li><div>開啟 <strong>「打開為網頁 App」</strong>，再按「加入」。</div></li><li><div>主畫面點選 WakeUp 圖示即可使用。這個單檔版本身不依賴外部網路，但 HTTPS 網址版的離線可用性取決於 Safari 的快取狀態。</div></li></ol><div class="alert">${icon('info',17)}<span>若直接從 iPhone「檔案」打開 HTML 可能只顯示預覽、不執行程式，也不保證能儲存。要用 Safari「加入主畫面」，請以 HTTPS 網址開啟。</span></div>`);
  return `${title('偏好與備份','重要的日常設定，都由你自己掌握。','SETTINGS')}<div class="settings-grid"><div>${setup}${panel('關於鬧鐘可靠性','info',`<p class="hint">PWA 無法直接操作 iOS 系統鬧鐘，也不以網頁推播代替叫醒。捷徑執行是否成功，仍須由你在「時鐘」App 核對；要避免舊鬧鐘重複響鈴，建議先在時鐘 App 清理舊鬧鐘。</p>`)}</div><div>${backup}${install}</div></div>`;
}
function snapshotPreset(id,name){const p=state.plan;return {id,name,selections:structuredClone(p.selections),bufferMinutes:p.bufferMinutes,mode:p.mode,leadMinutes:p.leadMinutes,routeId:p.selectedRouteId,travelMinutes:p.travelMinutes,metroStopId:p.metroStopId,metroRideMinutes:p.metroRideMinutes,metroWalkMinutes:p.metroWalkMinutes,metroPlatformLead:p.metroPlatformLead,metroService:p.metroService};}
async function actionClick(e){
  const b=e.target.closest('[data-action]');if(!b)return;
  const action=b.dataset.action;const id=b.dataset.id;
  if(action==='calculate'){resultVisible=true;refresh();const el=document.getElementById('plan-result');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(action==='nav'){page=b.dataset.page;refresh();window.scrollTo({top:0,behavior:'instant'});return;}
  if(action==='mode'){state.plan.mode=b.dataset.value;state.plan.presetId='';await commit();return;}
  if(action==='load-preset'){const p=state.presets.find(x=>x.id===id);if(!p)return;Object.assign(state.plan,{selections:structuredClone(p.selections),bufferMinutes:p.bufferMinutes,mode:p.mode,leadMinutes:p.leadMinutes,selectedRouteId:state.routes.some(r=>r.id===p.routeId)?p.routeId:'',travelMinutes:p.travelMinutes,metroStopId:p.metroStopId??'',metroRideMinutes:p.metroRideMinutes??20,metroWalkMinutes:p.metroWalkMinutes??7,metroPlatformLead:p.metroPlatformLead??3,metroService:p.metroService??'auto',presetId:p.id});page='plan';await commit();window.scrollTo({top:0,behavior:'instant'});toast(`已套用「${p.name}」`);return;}
  if(action==='save-preset'){const name=window.prompt('請幫這個準備組合取一個名字：','我的常用準備');if(name===null)return;if(!name.trim())return toast('請輸入情境名稱。');if(state.presets.length>=100)return toast('最多儲存 100 個情境。');const p=snapshotPreset(uid('preset'),name.trim().slice(0,80));state.presets.push(p);state.plan.presetId=p.id;await commit();toast('已儲存常用情境');return;}
  if(action==='overwrite-preset'){const p=state.presets.find(x=>x.id===id);if(!p)return;if(!confirm(`將目前準備組合覆蓋「${p.name}」？`))return;Object.assign(p,snapshotPreset(p.id,p.name));state.plan.presetId=p.id;await commit();toast('已更新情境');return;}
  if(action==='delete-preset'){const p=state.presets.find(x=>x.id===id);if(!p||!confirm(`刪除「${p.name}」情境？`))return;state.presets=state.presets.filter(x=>x.id!==id);if(state.plan.presetId===id)state.plan.presetId='';await commit();return;}
  if(action==='add-activity'){const name=prompt('新活動名稱（例如：洗澡、戴隱形眼鏡）：','新活動');if(name===null)return;if(!name.trim())return toast('請輸入活動名稱。');if(state.activities.length>=100)return toast('最多新增 100 個活動。');const minutes=prompt('預設花費幾分鐘？（0–240）','10');if(minutes===null)return;const n=Number(minutes);if(!Number.isFinite(n)||n<0||n>240)return toast('請輸入 0–240 分鐘。');const aid=uid('activity'),oid=uid('option');state.activities.push({id:aid,name:name.trim().slice(0,80),options:[{id:oid,name:'一般',minutes:num(n,0,240)}]});state.plan.selections[aid]={enabled:true,optionId:oid};state.plan.presetId='';await commit();toast('已新增活動');return;}
  if(action==='add-option'){const a=state.activities.find(x=>x.id===id);if(!a)return;if(a.options.length>=30)return toast('每項活動最多 30 個模式。');const name=prompt('新模式名稱：','快速');if(name===null)return;if(!name.trim())return toast('請輸入模式名稱。');const minutes=prompt('此模式幾分鐘？（0–240）','10');if(minutes===null)return;const n=Number(minutes);if(!Number.isFinite(n)||n<0||n>240)return toast('請輸入 0–240 分鐘。');a.options.push({id:uid('option'),name:name.trim().slice(0,80),minutes:num(n,0,240)});await commit();return;}
  if(action==='delete-option'){const a=state.activities.find(x=>x.id===id);if(!a||a.options.length===1)return;if(!confirm('刪除此活動模式？已儲存的情境若使用此模式，將改成該活動的第一個模式。'))return;a.options=a.options.filter(o=>o.id!==b.dataset.option);for(const s of [state.plan.selections,...state.presets.map(x=>x.selections)]){if(s[id]?.optionId===b.dataset.option)s[id].optionId=a.options[0].id;}state.plan.presetId='';await commit();return;}
  if(action==='delete-activity'){const a=state.activities.find(x=>x.id===id);if(!a||!confirm(`刪除「${a.name}」？相關情境也會移除此活動。`))return;state.activities=state.activities.filter(x=>x.id!==id);delete state.plan.selections[id];for(const p of state.presets)delete p.selections[id];state.plan.presetId='';await commit();return;}
  if(action==='move-activity'){const index=state.activities.findIndex(x=>x.id===id);const next=index+Number(b.dataset.direction);if(index<0||next<0||next>=state.activities.length)return;[state.activities[index],state.activities[next]]=[state.activities[next],state.activities[index]];await commit();return;}
  if(action==='save-metro-stop' || action==='add-metro-stop'){
     if(state.metroStops.length>=100)return toast('最多儲存 100 個常用目的站。');
     const name=prompt('目的捷運站名稱：','常用目的站');if(name===null)return;
     if(!name.trim())return toast('請輸入站名。');
     const current=metroRideTime(state);
     const mins=prompt('從新莊站搭車到目的站需要幾分鐘？',String(current));if(mins===null)return;
     const n=Number(mins);if(!Number.isFinite(n)||n<0||n>600)return toast('請輸入 0–600 分鐘。');
     const stop={id:uid('metro'),name:name.trim().slice(0,80),minutes:num(n,0,600)};
     state.metroStops.push(stop);state.plan.metroStopId=stop.id;state.plan.metroRideMinutes=stop.minutes;
     await commit();toast('已儲存目的捷運站');return;
   }
   if(action==='delete-metro-stop'){
     const stop=state.metroStops.find(x=>x.id===id);if(!stop||!confirm(`刪除「${stop.name}」？`))return;
     state.metroStops=state.metroStops.filter(x=>x.id!==id);
     if(state.plan.metroStopId===id)state.plan.metroStopId='';
     for(const preset of state.presets)if(preset.metroStopId===id)preset.metroStopId='';
     await commit();return;
   }
   if(action==='add-route'){if(state.routes.length>=100)return toast('最多儲存 100 條路線。');const name=prompt('路線名稱（例如：家 → 捷運站）：','家 → 捷運站');if(name===null)return;if(!name.trim())return toast('請輸入路線名稱。');const mins=prompt('交通時間（分鐘）：','12');if(mins===null)return;const n=Number(mins);if(!Number.isFinite(n)||n<0||n>600)return toast('請輸入 0–600 分鐘。');const route={id:uid('route'),name:name.trim().slice(0,80),from:'家',to:'',minutes:num(n,0,600)};state.routes.push(route);await commit();toast('已新增常用路線');return;}
  if(action==='delete-route'){const r=state.routes.find(x=>x.id===id);if(!r||!confirm(`刪除「${r.name}」路線？`))return;state.routes=state.routes.filter(x=>x.id!==id);if(state.plan.selectedRouteId===id)state.plan.selectedRouteId='';for(const p of state.presets)if(p.routeId===id)p.routeId='';await commit();return;}
  if(action==='copy-plan'){const r=calculate(state);if(r.error)return toast(r.error);const p=state.plan;const lines=[`WakeUp Planner｜${fullStamp(r.target)}`,`目標：${r.mode==='depart'?'出門':r.mode==='arrive'||r.mode==='metro'?'抵達':'搭乘班次'} ${fullStamp(r.target)}`,`起床：${fullStamp(r.wake)}`,`出門：${fullStamp(r.leave)}`,`早晨活動 ${r.prepMinutes} 分｜緩衝 ${r.bufferMinutes} 分｜交通 ${r.travelMinutes} 分｜提前抵達 ${r.leadMinutes} 分`,`總計 ${r.totalMinutes} 分`,...(r.mode==='metro'?[`新莊站往南勢角方向班次 ${fullStamp(r.trainDate)}`,`預計到目的站 ${fullStamp(r.arrival)}（提前 ${r.slackMinutes} 分）`,`車程 ${r.rideMinutes} 分｜步行 ${r.walkMinutes} 分｜月台緩衝 ${r.platformLead} 分`]:[]),``,...r.timeline.map(x=>`${timeKey(x.start)} ${x.name}${x.end?'（'+x.minutes+' 分）':''}`)];await copyText(lines.join('\n'));return;}
  if(action==='copy-alarm-input'){const r=calculate(state);if(r.error)return toast(r.error);await copyText(`${dateKey(r.wake)} ${timeKey(r.wake)}`);return;}
  if(action==='launch-shortcut'){
    const r=calculate(state);if(r.error)return toast(r.error);
    if(!canShortcut(r)){toast('請在預計起床前 24 小時內操作；若時間已過，請先修改日期。');return;}
    const name=state.settings.shortcutName.trim();if(!name)return toast('請先在設定頁填寫捷徑名稱。');
    const input=`${dateKey(r.wake)} ${timeKey(r.wake)}`;
    const url=`shortcuts://run-shortcut?name=${encodeURIComponent(name)}&input=text&text=${encodeURIComponent(input)}`;
    toast(`正在嘗試開啟捷徑：${timeKey(r.wake)}。完成後務必到「時鐘」確認！`);
    window.location.href=url;
    return;
  }
  if(action==='export'){const payload={app:'WakeUp Planner',exportedAt:new Date().toISOString(),schemaVersion:1,data:state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download=`WakeUpPlanner_backup_${dateKey(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);toast('已產生備份檔，請保存到 iCloud Drive。');return;}
  if(action==='import'){document.getElementById('import-file').click();return;}
  if(action==='reset'){if(!confirm('確定清除所有活動、情境、路線及時間設定，恢復範例資料？此動作無法復原。'))return;state=defaultState();page='plan';await commit();toast('已恢復初始範例設定');return;}
}
async function copyText(text) {try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);toast('已複製到剪貼簿');return;}}catch(_){}const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'已複製到剪貼簿':'複製失敗，請嘗試從 Safari 操作');}
async function fieldChange(event){
  const el=event.target; const field=el.dataset.field;if(!field)return;
  const p=state.plan;const id=el.dataset.id;const optionId=el.dataset.option;
  if(field==='targetDate'){p.targetDate=el.value;}
  else if(field==='targetTime'){p.targetTime=el.value;}
  else if(field==='metroStopId'){p.metroStopId=el.value;p.presetId='';}
   else if(field==='metroRideMinutes'){p.metroRideMinutes=num(el.value,0,600,20);p.presetId='';}
   else if(field==='metroWalkMinutes'){p.metroWalkMinutes=num(el.value,0,240,7);p.presetId='';}
   else if(field==='metroPlatformLead'){p.metroPlatformLead=num(el.value,0,120,3);p.presetId='';}
   else if(field==='metroService'){p.metroService=['auto','weekday','holiday'].includes(el.value)?el.value:'auto';p.presetId='';}
   else if(field==='selectedRouteId'){p.selectedRouteId=el.value;p.presetId='';}
  else if(field==='travelMinutes'){p.travelMinutes=num(el.value,0,600,0);p.presetId='';}
  else if(field==='leadMinutes'){p.leadMinutes=num(el.value,0,120,0);p.presetId='';}
  else if(field==='bufferMinutes'){p.bufferMinutes=num(el.value,0,180,0);p.presetId='';}
  else if(field==='enabled'){const a=state.activities.find(x=>x.id===id);if(!a)return;if(!p.selections[id])p.selections[id]={enabled:false,optionId:a.options[0].id};p.selections[id].enabled=el.checked;p.presetId='';}
  else if(field==='option'){const a=state.activities.find(x=>x.id===id);if(!a||!a.options.some(o=>o.id===el.value))return;if(!p.selections[id])p.selections[id]={enabled:true,optionId:el.value};p.selections[id].optionId=el.value;p.presetId='';}
  else if(field==='shortcutName'){state.settings.shortcutName=el.value.trim().slice(0,80)||'WakeUp 設定鬧鐘';}
  else if(['activityName','optionName','optionMinutes'].includes(field)) {const a=state.activities.find(x=>x.id===id);if(!a)return;const o=a.options.find(x=>x.id===optionId);if(field==='activityName')a.name=el.value.trim().slice(0,80)||a.name;else if(o&&field==='optionName')o.name=el.value.trim().slice(0,80)||o.name;else if(o&&field==='optionMinutes')o.minutes=num(el.value,0,240,0);}
  else if(['metroStopName','metroStopMinutes'].includes(field)){const m=state.metroStops.find(x=>x.id===id);if(!m)return;if(field==='metroStopName')m.name=el.value.trim().slice(0,80)||m.name;else m.minutes=num(el.value,0,600,20);}
   else if(['routeFrom','routeTo','routeName','routeMinutes'].includes(field)){const r=state.routes.find(x=>x.id===id);if(!r)return;if(field==='routeFrom')r.from=el.value.trim().slice(0,80);if(field==='routeTo')r.to=el.value.trim().slice(0,80);if(field==='routeName')r.name=el.value.trim().slice(0,80)||r.name;if(field==='routeMinutes')r.minutes=num(el.value,0,600,0);}
  else return;
  await commit();
}
async function fileImport(e){const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>1_000_000)return toast('備份檔過大（超過 1 MB），已取消。');let imported;try{const raw=JSON.parse(await file.text());imported=sanitizeState(raw?.data ?? raw); } catch(err){toast('備份讀取失敗：'+(err.message||'格式錯誤'));return;}if(!confirm('確定匯入備份？目前所有設定將被取代，建議先匯出現在的資料。'))return;state=imported;page='plan';await commit();toast('已成功還原備份資料');}
async function start(){const result=await initializeStorage();try{state=result.data?sanitizeState(result.data):defaultState();}catch(err){state=defaultState();toast('儲存資料格式錯誤，請先備份並檢查。');}updateStaleDate(state);refresh();await persist();if (location.protocol === 'https:' && 'serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => { if(reg.scope.startsWith(location.origin)) reg.unregister(); })).catch(()=>{}); }}
app.addEventListener('click',event=>{actionClick(event).catch(err=>toast('操作失敗：'+err.message));});
app.addEventListener('change',event=>{fieldChange(event).catch(err=>toast('修改失敗：'+err.message));});
document.getElementById('import-file').addEventListener('change',e=>fileImport(e).catch(err=>toast(err.message)));
start().catch(err=>{app.innerHTML=`<div class="boot"><div class="boot-icon">!</div><div>無法啟動</div><small>請重新整理或改用 Safari：${esc(err.message)}</small></div>`;});

</script>
